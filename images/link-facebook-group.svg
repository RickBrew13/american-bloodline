<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-label="An American Bloodline — join our Facebook family group">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1a09"/>
      <stop offset="0.55" stop-color="#180e05"/>
      <stop offset="1" stop-color="#0d0703"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#f0c66a" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#b08d57" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3d0"/>
      <stop offset="0.42" stop-color="#f0c66a"/>
      <stop offset="0.72" stop-color="#c48a2c"/>
      <stop offset="1" stop-color="#f3d48c"/>
    </linearGradient>
    <linearGradient id="rule2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b08d57" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e8b85a" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#b08d57" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="560" fill="url(#bg2)"/>
  <rect width="1280" height="560" fill="url(#glow2)"/>

  <!-- double gold frame -->
  <rect x="26" y="26" width="1228" height="508" fill="none" stroke="#b08d57" stroke-opacity="0.55" stroke-width="2"/>
  <rect x="40" y="40" width="1200" height="480" fill="none" stroke="#e8b85a" stroke-opacity="0.28" stroke-width="1"/>

  <!-- corner flourishes -->
  <g stroke="#e8b85a" stroke-opacity="0.75" stroke-width="2" fill="none">
    <path d="M26 96 L26 26 L96 26"/>
    <path d="M1254 96 L1254 26 L1184 26"/>
    <path d="M26 464 L26 534 L96 534"/>
    <path d="M1254 464 L1254 534 L1184 534"/>
  </g>

  <!-- family / gathering motif: three linked figures, left -->
  <g transform="translate(150 300)" stroke="#b08d57" stroke-opacity="0.55" fill="none" stroke-width="2.5" stroke-linecap="round">
    <circle cx="0" cy="-34" r="15"/>
    <path d="M-24 34 C-24 4 -12 -8 0 -8 C12 -8 24 4 24 34"/>
    <circle cx="-46" cy="-18" r="11"/>
    <path d="M-64 34 C-64 12 -56 2 -46 2 C-38 2 -32 8 -30 18"/>
    <circle cx="46" cy="-18" r="11"/>
    <path d="M64 34 C64 12 56 2 46 2 C38 2 32 8 30 18"/>
  </g>

  <!-- family motif, right (mirrored) -->
  <g transform="translate(1130 300) scale(-1 1)" stroke="#b08d57" stroke-opacity="0.55" fill="none" stroke-width="2.5" stroke-linecap="round">
    <circle cx="0" cy="-34" r="15"/>
    <path d="M-24 34 C-24 4 -12 -8 0 -8 C12 -8 24 4 24 34"/>
    <circle cx="-46" cy="-18" r="11"/>
    <path d="M-64 34 C-64 12 -56 2 -46 2 C-38 2 -32 8 -30 18"/>
    <circle cx="46" cy="-18" r="11"/>
    <path d="M64 34 C64 12 56 2 46 2 C38 2 32 8 30 18"/>
  </g>

  <!-- eyebrow -->
  <text x="640" y="196" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="26" letter-spacing="11" fill="#e8b85a" fill-opacity="0.9">MEMBERS ONLY</text>

  <!-- title -->
  <text x="640" y="292" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="700" font-size="76" letter-spacing="4" fill="url(#gold2)">AN AMERICAN BLOODLINE</text>

  <!-- divider -->
  <rect x="440" y="330" width="400" height="2" fill="url(#rule2)"/>
  <text x="640" y="352" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#e8b85a" fill-opacity="0.85">&#10022; &#9733; &#10022;</text>

  <!-- subtitle -->
  <text x="640" y="410" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="34" fill="#f3d48c">Questions, corrections, brick walls, breakthroughs</text>
  <text x="640" y="456" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="30" fill="#d9c9ab" fill-opacity="0.85">You must be family to join &#8212; we will make you a profile</text>
</svg>
