<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#120a04;height:100%}

.btns{display:flex;justify-content:center;gap:2.5vw;flex-wrap:wrap;margin-bottom:1.6vw}
.btn{display:flex;align-items:center;gap:1.4vw;min-width:min(26vw,420px);padding:1.1vw 2.2vw;text-decoration:none;color:#f7e6bd;

.btn:hover{transform:translateY(-2px);box-shadow:0 0 0 1px #6b4a17 inset,0 0 0 5px rgba(20,12,4,.9),0 0 0 6.5px #f0c66a,0 0 22px rgba(240,198,106,.45)}
.btn svg{width:clamp(26px,3.2vw,56px);height:clamp(26px,3.2vw,56px);flex:none;fill:#e8b85a}
.btn span{flex:1}
.welcome{font-family:'Pinyon Script',cursive;color:#f0c66a;font-size:clamp(24px,3.3vw,54px);text-shadow:0 2px 6px #000}
.line{font-family:'Cormorant Garamond',Georgia,serif;color:#f4e3bf;font-size:clamp(14px,1.75vw,30px);text-shadow:0 2px 4px #000}
.bot .orn{margin:0 auto .3vw;width:min(92%,1500px)}
@media (max-width:700px){.hero{aspect-ratio:auto;padding:24px 14px 18px}.btns{flex-direction:column;align-items:center;gap:14px}.btn{min-width:82vw;padding:12px 18px;gap:14px}}
